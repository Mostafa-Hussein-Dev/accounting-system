services:
  postgres:
    image: postgres:17-alpine
    container_name: accounting_postgres
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: accounting_user
      POSTGRES_PASSWORD: accounting_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accounting_user -d accounting_db']
      interval: 10s
      retries: 5
    networks:
      - accounting_network

  redis:
    image: redis:8-alpine
    container_name: accounting_redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
    networks:
      - accounting_network

  # Uncomment when Dockerfile is ready
