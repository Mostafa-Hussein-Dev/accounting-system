# PostgreSQL runs natively on the host (localhost:5432), not in Docker.
services:
  redis:
    image: redis:8-alpine
    container_name: accounting_redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
    networks:
      - accounting_network

  # Dev-only SMTP catcher — nothing sent through it ever leaves the machine.
  # Web UI at http://localhost:8025 to actually read password-reset emails
  # during local development; matches the SMTP_HOST/SMTP_PORT defaults in
  # .env.example, no auth/TLS needed for local dev.
  mailpit:
    image: axllent/mailpit:latest
    container_name: accounting_mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    restart: unless-stopped
    networks:
      - accounting_network

  # Uncomment when Dockerfile is ready
  # api:
  #   build: .
  #   container_name: accounting_api
  #   ports:
  #     - '3000:3000'
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   env_file: .env
  #   volumes:
  #     - ./src:/app/src
  #   restart: unless-stopped
  #   networks:
  #     - accounting_network

volumes:
  redis_data:

networks:
  accounting_network:
